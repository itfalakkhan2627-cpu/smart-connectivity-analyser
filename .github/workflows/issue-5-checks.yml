name: Issue 5 focused checks

'on':
  pull_request:
    branches: [master, main]
  push:
    branches: [staging/issue-5-focused-fix, improve-dashboard-empty-states]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check JavaScript syntax
        run: node --check js/script.js
      - name: Check dashboard empty-state markup and behavior hooks
        run: node --test tests/dashboard-empty-states.test.js
      - name: Check Python backend syntax
        run: python -m py_compile backend/main.py
